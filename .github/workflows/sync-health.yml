name: Sync health

# Daily: fails when a sync job, loader or database job failed, is overdue or died
# mid-run (private.sync_health()). A dataset with nothing new for longer than usual
# is a warning on the run, not a failure. A failed run is how the owner hears about
# it: GitHub emails a failed scheduled workflow. The same list, without error text,
# is on the site's Data status page.
#
# A second channel: when the HEARTBEAT_URL secret is set (a dead-man's-switch check,
# e.g. healthchecks.io), each run pings it, adding /fail when the check failed, so an
# outside service alerts if the checks fail or stop running at all.
#
# GitHub turns off scheduled workflows in a repository with no commits for 60 days;
# re-enable it on the Actions tab if that happens.
on:
  workflow_dispatch:
  schedule:
    - cron: '13 13 * * *' # 13:13 UTC daily, after the morning loaders

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check jobs and data
        id: check
        run: npx tsx scripts/check-health.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Ping the heartbeat
        if: always()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then echo "No HEARTBEAT_URL set; skipping."; exit 0; fi
          url="$HEARTBEAT_URL"
          if [ "$OUTCOME" != 'success' ]; then url="${url%/}/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url"
