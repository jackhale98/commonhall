name: Deploy Supabase

# Applies migrations and deploys Edge Functions to the linked Supabase project.
# Skips cleanly until the three secrets below are configured (e.g. on a fresh fork).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets not configured; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.config.outputs.skip != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - if: steps.config.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: steps.config.outputs.skip != 'true'
        name: Apply migrations
        run: supabase db push
      - if: steps.config.outputs.skip != 'true'
        name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
