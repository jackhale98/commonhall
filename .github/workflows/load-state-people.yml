name: Load state people and committees

# State legislators' offices, phones and links, and every state's committees with
# their members, from Open States' people repository (github.com/openstates/people,
# CC0). It changes a few times a week; a weekly run keeps up. Uses none of the Open
# States API allowance. Safe to re-run: each state's committees are replaced.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1' # 08:23 UTC every Monday

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # When this run started, so a failure recorded by the loader itself is kept (see the last step).
      - run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load legislators and committees
        run: npm run load-state-people
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # A run that fails before or outside the loader (installing packages or the browser)
      # records nothing itself; record it here so the health check reports it the same day.
      - name: Record the failure for the health check
        if: failure()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JOB: load-state-people
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v job="$JOB" -v started="$STARTED" <<'SQL'
          insert into public.sync_state (job, last_error, last_error_at, updated_at)
          values (:'job', 'The workflow failed outside the loader (see its run in GitHub Actions).', now(), now())
          on conflict (job) do update
             set last_error = excluded.last_error, last_error_at = excluded.last_error_at, updated_at = now()
           where public.sync_state.last_error_at is null
              or public.sync_state.last_error_at < :'started'::timestamptz;
          SQL
