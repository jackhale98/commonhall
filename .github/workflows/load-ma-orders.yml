name: Load governor orders

# Massachusetts governors' executive orders from the Trial Court Law Libraries' list
# on mass.gov. mass.gov turns away plain requests, so the pages are read in a
# headless browser. A weekly run picks up new orders; orders already loaded are
# not opened again.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1' # 10:23 UTC on Mondays

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Load the orders
        run: npx tsx scripts/load-ma-orders.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
