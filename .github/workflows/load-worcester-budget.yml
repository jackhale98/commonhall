name: Load Worcester budget

# Worcester's capital and operating budgets, from the PDFs the city posts on its open data site
# (opendata.worcesterma.gov) once or twice a year: the proposal in spring, the
# adopted budget in summer. A monthly run picks up a new one; documents already
# loaded are skipped. Refuses a document whose lines don't match its sub-totals.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Reload documents already loaded
        type: boolean
        default: false
  schedule:
    - cron: '41 9 3 * *' # 09:41 UTC on the 3rd of each month

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # pdftotext; refresh the package list first (the runner image's can be out of date).
      - name: Install pdftotext
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils)
      - run: npm ci
      - name: Load the capital budget
        run: |
          args=()
          if [ "$FORCE" = 'true' ]; then args+=(--force); fi
          npx tsx scripts/load-worcester-budget.ts "${args[@]}"
        env:
          FORCE: ${{ inputs.force }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
