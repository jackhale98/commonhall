name: Load council districts

# Once per city (and after redistricting): downloads a city's council districts
# (or its whole boundary, for at-large councils) into council_districts, from the
# source listed in scripts/load-districts.ts. Safe to re-run: the city's districts
# are replaced.
on:
  workflow_dispatch:
    inputs:
      city:
        description: Which city (or all of them); sources are in scripts/load-districts.ts
        type: choice
        default: all
        options:
          - all
          - ma-boston
          - ma-cambridge
          - ma-somerville
          - ct-bristol
          - ct-middletown

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load council districts
        run: npx tsx scripts/load-districts.ts --city "$CITY"
        env:
          CITY: ${{ inputs.city }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
