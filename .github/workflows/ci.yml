name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --project unit
      # Builds with no Supabase env: proves a fresh fork builds before it is configured.
      - run: npm run build

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Type-check functions
        working-directory: supabase/functions
        run: |
          shopt -s nullglob
          files=(*/index.ts)
          if [ ${#files[@]} -gt 0 ]; then deno check "${files[@]}"; fi

  db:
    name: Database (migrations, RLS, sync jobs, functions, Pol.is privacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,supavisor,edge-runtime,mailpit,postgres-meta
      # Before the DB tests, which reload the seed data: needs the seeded example discussion.
      - name: Pol.is privacy check
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          npx playwright install --with-deps chromium
          PUBLIC_SUPABASE_URL="$API_URL" PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            PUBLIC_POLIS_SITE_ID=polis_site_id_test PUBLIC_OPEN_PARTICIPATION=false npm run build
          (cd site && npx astro preview --port 4321 > /tmp/preview.log 2>&1 &)
          for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:4321/ && break; sleep 1; done
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SITE=http://localhost:4321/ npm run check:polis
      - run: npm run test:db
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Serve Edge Functions (smoke test)
        run: scripts/smoke-functions.sh
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
