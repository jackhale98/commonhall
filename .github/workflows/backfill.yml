name: Backfill

# One-off load of the current Congress (members, bills; votes from Phase 4).
# About 100k Congress.gov requests: the script pauses at the hourly limit and
# resumes from its cursor. A job may run at most 6 hours, so when time runs out
# the workflow dispatches itself again (up to `max_chain` times).
on:
  workflow_dispatch:
    inputs:
      congress:
        description: Congress number (blank = current)
        required: false
      reset:
        description: Start over (clears the backfill cursor)
        type: boolean
        default: false
      max_chain:
        description: How many more times to re-dispatch automatically
        default: '8'

permissions:
  contents: read
  actions: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: run
        name: Backfill
        run: |
          args=()
          if [ -n "$CONGRESS" ]; then args+=(--congress "$CONGRESS"); fi
          if [ "$RESET" = 'true' ]; then args+=(--reset); fi
          npm run backfill -- "${args[@]}"
        env:
          CONGRESS: ${{ inputs.congress }}
          RESET: ${{ inputs.reset }}
          # Use the Supavisor session pooler URL (IPv4); Actions runners cannot reach the IPv6-only direct host.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          BACKFILL_MAX_HOURS: '5.5'
      - name: Continue in a new run
        if: steps.run.outputs.done == 'false' && fromJSON(inputs.max_chain || '0') > 0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          CONGRESS: ${{ inputs.congress }}
          MAX_CHAIN: ${{ inputs.max_chain }}
        # Look the repository up by its permanent id, so the chain survives a rename
        # made while this run was going (github.repository is the name at start).
        run: |
          case "$MAX_CHAIN" in ''|*[!0-9]*) echo "max_chain must be a number"; exit 1;; esac
          repo="$(gh api "repositories/$REPO_ID" --jq .full_name 2>/dev/null || true)"
          gh workflow run backfill.yml --repo "${repo:-$REPO_NAME}" --ref "$REF_NAME" \
            -f congress="$CONGRESS" \
            -f max_chain="$(( MAX_CHAIN - 1 ))"
