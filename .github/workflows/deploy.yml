name: Deploy site

# Builds the static site from Supabase and publishes it to GitHub Pages.
# Built output is never committed.
on:
  push:
    branches: [main]
    # Docs, loaders and other workflows don't change the site. (Each build reads about
    # 60 MB from Supabase, which counts toward its monthly egress.)
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'
      - '.github/workflows/load-*.yml'
      - '.github/workflows/backfill.yml'
      - '.github/workflows/sync-health.yml'
  workflow_dispatch:
  workflow_call:
  # Rebuild once new migrations are live, so pages pick up new tables and columns.
  workflow_run:
    workflows: [Deploy Supabase]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A push that changes the database or the sync code deploys Supabase first, and the
  # workflow_run trigger builds once that is live; building on the push as well would
  # read everything from Supabase twice.
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE" 2>/dev/null \
            && git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(supabase/|packages/|\.github/workflows/supabase-deploy\.yml)'; then
            build=false
            echo "Supabase changes in this push: the site builds after Deploy Supabase." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: >-
      needs.plan.outputs.build == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Public values (repository variables, not secrets): safe in the browser because RLS is on for every table.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SITE_NAME: ${{ vars.PUBLIC_SITE_NAME }}
          # Pol.is site id for discussions (public; from the Pol.is admin integrate page).
          PUBLIC_POLIS_SITE_ID: ${{ vars.PUBLIC_POLIS_SITE_ID }}
          PUBLIC_OPEN_PARTICIPATION: ${{ vars.PUBLIC_OPEN_PARTICIPATION }}
          # No Supabase project configured yet: build the demo from site/src/data/demo.json.
          PUBLIC_DEMO: ${{ vars.PUBLIC_SUPABASE_URL == '' && 'true' || 'false' }}
      - name: Check site size
        # GitHub Pages allows 1 GB; only notable items are prerendered to stay well under 300 MB.
        run: |
          size=$(du -sm site/dist | cut -f1)
          pages=$(find site/dist -name index.html | wc -l)
          echo "Built site: ${size} MB, ${pages} pages" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 300 ]; then
            echo "::error::site/dist is ${size} MB, over the 300 MB budget. Tighten the prerender views (docs/decisions.md)."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
